<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebRTC Live Monitor</title><link rel="stylesheet" href="popup.css"></head><body>
<main><header><div><h1>WebRTC Live Monitor</h1><p id="status" class="status">Wird geladen …</p></div><span id="pulse" aria-hidden="true"></span></header>
<section class="card peers"><h2>Peer Connections</h2><strong id="peers">0</strong></section>
<section class="card audio"><h2>Audio</h2><dl><div><dt>Eingehend</dt><dd id="audio-in">0</dd></div><div><dt>Ausgehend</dt><dd id="audio-out">0</dd></div><div class="total"><dt>Gesamt</dt><dd id="audio-total">0</dd></div></dl></section>
<section class="card video"><h2>Video</h2><dl><div><dt>Eingehend</dt><dd id="video-in">0</dd></div><div><dt>Ausgehend</dt><dd id="video-out">0</dd></div><div class="total"><dt>Gesamt</dt><dd id="video-total">0</dd></div></dl></section>
<footer><p>Letzte Aktualisierung: <time id="updated">–</time></p><button id="reset" type="button">Zurücksetzen</button></footer></main><script src="popup.js"></script></body></html>
